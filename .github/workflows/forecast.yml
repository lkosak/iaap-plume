name: Forecast archive

on:
  schedule:
    # Every two hours. The snapshot itself stops after 24 Nov 2026 CT
    # (2026-11-25 06:00 UTC). Newest HRRR and RRFS cycles are requested on
    # each run and kept only when they cover the Monday release window.
    - cron: "10 */2 * * *"
    # One confirmation slot. GitHub dropped 18:10Z and 20:10Z while the
    # workflow actor was not a repository collaborator. Remove after it runs.
    - cron: "12 21 20 11 *"
  workflow_dispatch:

# contents: write so this job can append archive files.
# pages + id-token so this job can redeploy. A push made with the default
# GITHUB_TOKEN does not start the Pages workflow.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast-archive
  # A new scheduled run replaces one that is still going, so a hung snapshot
  # cannot queue the later hours.
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      open: ${{ steps.window.outputs.open }}
    steps:
      - id: window
        run: |
          now=$(date -u +%s)
          deadline=$(date -u -d '2026-11-25 06:00:00 UTC' +%s)
          if [ "$now" -lt "$deadline" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Past 24 Nov 2026 CT. Scheduled updates stop. Manual dispatch still deploys."
          fi

  snapshot:
    needs: gate
    if: needs.gate.outputs.open == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the screening ensemble
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          # Trajectories are attached by hysplit.yml so this job cannot
          # spend its budget on a multi-gigabyte ARL download.
          SKIP_HYSPLIT: "1"
        run: python -u -m pipeline.run_snapshot --out web/public/runs --honor-deadline
      - name: Commit the new archive entry
        timeout-minutes: 2
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add web/public/runs
          if git diff --cached --quiet; then
            echo "No new archive files."
          else
            git commit -m "Archive forecast screening run"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Pick up a trajectory file published while the ensemble was running
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build static export
        timeout-minutes: 8
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /iaap-plume
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
